# CI for the merged backend (doc/SERVICE_MERGE_PLAN.md).
#
# Phase 0 created this with one job per service. Phase 5 merged api/ and
# worker-service/ into server/, so there is now a single install, a single
# typecheck and a single test run.
name: CI

on:
  push:
    branches: [economy]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # ── Dummy values, not secrets ───────────────────────────────────────────────
  # The service validates its environment with zod at *import* time and calls
  # `process.exit(1)` when a required variable is missing, so the suite cannot
  # even load without these. Nothing here reaches the network: no test opens a
  # database connection or calls an external API.
  #
  # `RESEND_API_KEY` and `GOOGLE_CLIENT_*` are genuinely optional now (the
  # server boots without them); they stay here so the email and Google auth
  # code paths load the same way they do in production.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  ACCESS_TOKEN_SECRET: ci-access-token-secret-not-a-real-key
  DEEPSEEK_API_KEY: ci-dummy
  E2B_API_KEY: ci-dummy
  TAVILY_API_KEY: ci-dummy
  R2_ACCOUNT_ID: ci-dummy
  R2_ACCESS_KEY_ID: ci-dummy
  R2_SECRET_ACCESS_KEY: ci-dummy
  R2_BUCKET: ci-dummy
  MAX_AGENT_DEPTH: "3"
  RESEND_API_KEY: re_ci_dummy
  GOOGLE_CLIENT_ID: ci-dummy
  GOOGLE_CLIENT_SECRET: ci-dummy
  TAU_KEY_ENC_SECRET: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
  GATEWAY_MAX_CONCURRENT: "8"
  GATEWAY_MAX_CONCURRENT_GLOBAL: "12"

jobs:
  drift:
    name: drift guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      # No `bun install`: test/drift.test.ts imports only node:fs by design, so
      # this job stays fast and cannot be broken by a dependency problem.
      - run: bun run test:drift

  server:
    name: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
        working-directory: server
      # `src/generated/prisma` is gitignored, so the client must be generated
      # before tsc runs or every `@/generated/prisma/*` import fails.
      # `prisma generate` reads DATABASE_URL from prisma.config.ts but never
      # connects, so the dummy above is enough.
      - run: bun run generate
        working-directory: server
      - run: bun run typecheck
        working-directory: server
      - run: bun test
        working-directory: server

  # The router Worker for published apps. Its rules are checked against the
  # server's by server/test/api/siteEdgeDrift.test.ts in the job above; this one checks the
  # Worker itself and that it still bundles.
  edge:
    name: edge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
        working-directory: edge
      - run: bun run typecheck
        working-directory: edge
      - run: bun test test/
        working-directory: edge
      - run: bun run dry-run
        working-directory: edge

  docker:
    name:docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build only, no push: catches a broken Dockerfile or .dockerignore here
      # instead of on the server during a deploy.
      - run: docker build -t tau-server:ci .
      # The image must boot far enough to validate its own environment. With
      # no database, /healthz answering 503 still proves the process is up.
      - name: smoke test
        run: |
          docker run -d --name tau --init -p 8080:8080 \
            -e DATABASE_URL -e ACCESS_TOKEN_SECRET -e DEEPSEEK_API_KEY \
            -e E2B_API_KEY -e TAVILY_API_KEY -e R2_ACCOUNT_ID \
            -e R2_ACCESS_KEY_ID -e R2_SECRET_ACCESS_KEY -e R2_BUCKET \
            -e MAX_AGENT_DEPTH tau-server:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/healthz || true)
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then echo "healthz: $code"; exit 0; fi
            sleep 2
          done
          docker logs tau
          exit 1

  web:
    name: web unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned explicitly: neither package.json declares `packageManager`, and
      # action-setup fails outright rather than guessing when it can't find one.
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      # web/ installs with pnpm — it has its own lockfile, separate from the
      # root one — but already runs bun as a tool, which is what `docs:index`
      # does. `bun test` is the same arrangement: the runner is bun, the
      # dependency tree is pnpm's.
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm run test
        working-directory: web
      # DELIBERATELY no `lint` or `tsc -b` step yet. Both fail on this branch
      # today for reasons that predate everything they would guard — 10 lint
      # problems (Billing.tsx, glow-loader ×2, star-particles,
      # stars-background, text-animate, button.tsx, EffortDropdown, ChatPanel
      # ×2) and 3 type errors (EffortDropdown's unused `ceilings`, api.ts's
      # query updater, ChatLoader's missing `max` prop). Adding the steps now
      # would land a permanently red job rather than a guard. Fix those twelve,
      # then add them here.

  admin:
    name: admin console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # admin/ is its own pnpm project with its own lockfile, like web/.
      - run: pnpm install --frozen-lockfile
        working-directory: admin
      - run: pnpm lint
        working-directory: admin
      # `tsc -b && vite build`. The build refuses to run without an API URL
      # (a console pointed at localhost can never sign in), so give it the real one.
      - run: pnpm build
        working-directory: admin
        env:
          VITE_API_URL: https://api.tauai.pro

  mobile-parity:
    name: mobile API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      # `mobile/` is currently in the root .gitignore, so it does not exist in a
      # clean checkout and this step is skipped. Delete that .gitignore line
      # (PLATFORM_COMPARISON.md §5.14 / §6.4) and the check starts running by
      # itself — no workflow edit needed.
      #
      # UNVERIFIED: this is the one step that could not be tested before
      # committing, precisely because mobile/ is untracked. Expect to fix it on
      # the first run after mobile/ lands.
      - name: check web ↔ mobile API parity
        if: hashFiles('mobile/scripts/check-parity.ts') != ''
        run: bun run check:mobile
