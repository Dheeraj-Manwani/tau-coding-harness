name: Deploy server

on:
  workflow_dispatch:            # adds a "Run workflow" button, never runs by itself
    inputs:
      deploy:
        description: "Also deploy to the server (untick to only build the image)"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write               # allows pushing to GHCR

env:
  IMAGE: ghcr.io/dheeraj-manwani/tau-server   # must be all lowercase

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The server has an ARM chip. QEMU lets this Intel machine build for ARM.
      # It's slow (15-25 min the first time, faster after, thanks to the cache).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/tau
            export TAG=${{ github.sha }}
            docker compose pull app
            # Migrations go over Neon's DIRECT connection; the pooler can't hold their lock.
            docker compose run --rm app sh -c 'cd server && DATABASE_URL="${DIRECT_URL:?DIRECT_URL is missing from .env}" bunx prisma migrate deploy'
            docker compose up -d app
            for i in $(seq 1 30); do
              if curl -fsS https://api.tauai.pro/healthz; then
                # Each old version is ~3 GB on disk. They stay on GHCR for rollbacks.
                docker image prune -af
                exit 0
              fi
              sleep 5
            done
            echo "Health check failed"; docker compose logs --tail 100 app; exit 1
